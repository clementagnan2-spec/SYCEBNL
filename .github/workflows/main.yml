name: Compiler le .exe Windows

# Se déclenche à chaque push sur main, sur les tags de version (v1.0.0, ...),
# sur les pull requests, et peut aussi être lancé manuellement depuis l'onglet
# "Actions" de GitHub (bouton "Run workflow").
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler l'exécutable avec PyInstaller
        run: |
          pyinstaller sycebnl_liasse.spec --noconfirm --clean

      - name: Vérifier que l'exécutable a bien été produit
        run: |
          if (!(Test-Path "dist/GenerateurLiasseSYCEBNL.exe")) {
            throw "L'exécutable n'a pas été généré."
          }

      # L'exécutable est toujours publié comme "artifact" de build, téléchargeable
      # depuis l'onglet Actions > l'exécution correspondante, même sans tag.
      - name: Publier l'exécutable comme artifact de build
        uses: actions/upload-artifact@v4
        with:
          name: GenerateurLiasseSYCEBNL-windows
          path: dist/GenerateurLiasseSYCEBNL.exe
          retention-days: 90

      # Si le push correspond à un tag de version (ex: v1.0.0), une Release
      # GitHub est créée automatiquement avec l'exécutable en pièce jointe.
      - name: Créer une Release GitHub (si tag de version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GenerateurLiasseSYCEBNL.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
